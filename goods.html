      <nav class="hp-nav main-nav" id="hp-nav">
        <a data-nav="home" href="index.html">Home</a>
        <a data-nav="works" href="works.html">Works</a>
        <a data-nav="designer" href="designer.html">Designer</a>
        <a data-nav="goods" class="is-active" href="goods.html">Archive</a>      </nav>
      <button class="hp-hamburger hide-d hide-t" id="hp-menu-btn" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <!-- ================= BODY ================= -->
    <div class="gd-body">
      <!-- 좌측 카테고리 (전시 전경 / 웨이브) -->
      <aside class="gd-cats" id="gd-cats">
        <!-- 전시 전경 : 전시 사진 촬영 후 추가 예정 (잠시 숨김)
        <button class="gd-cat" type="button" data-desc="off">
          <span class="gd-cat__arrow" aria-hidden="true"></span>
          <span class="gd-cat__text">
            <span class="gd-cat__ko">전시 전경</span>
            <span class="gd-cat__en">Exhibition view</span>
          </span>
        </button>
        -->
        <button class="gd-cat" type="button" data-desc="on">
          <span class="gd-cat__arrow" aria-hidden="true"></span>
          <span class="gd-cat__text">
            <span class="gd-cat__ko">굿즈</span>
            <span class="gd-cat__en">Merchandise</span>
          </span>
        </button>
      </aside>

      <!-- 우측 본문 : 설명(굿즈만) + 이미지 스택 -->
      <div class="gd-main">
        <p class="gd-desc" id="gd-desc"></p>
        <div class="gd-gallery" id="gd-gallery"></div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      var cats = Array.prototype.slice.call(document.querySelectorAll(".gd-cat"));
      var descEl = document.getElementById("gd-desc");
      var gallery = document.getElementById("gd-gallery");

      // 굿즈 사진 콜라주 (Figma 11535:3870) · 좌우 번갈아 · 크기 제각각 스캐터 배열
      // 좌표계 : 콘텐츠 영역 1960 × 10768 (Figma 기준) → 비율(%)로 변환해 반응형 재현
      var BASE = "assets/images/archive/";
      // 간격(가로·세로)을 40으로 통일해 재배치 · 이미지 크기/좌우정렬/세로 스태거 유지
      var CW = 1964, CH = 10100;
      // [x, y, w, h, 파일]  (x,y = 콘텐츠 영역 기준 좌상단)
      var SHOTS = [
        [   0,    0,  934, 1401, "pst_1.webp"],
        [ 974,  744,  986,  657, "pb_2.webp"],
        [ 458, 1441, 1506, 1004, "pb_1.webp"],
        [   0, 2485, 1200,  800, "sticker_2.webp"],
        [1240, 2485,  720, 1081, "mt_1.webp"],
        [1022, 3606,  942, 1413, "pb_3.webp"],
        [   0, 5059, 1507, 1005, "sticker_3.webp"],
        [ 859, 6104, 1105, 1657, "st_1.webp"],
        [   0, 7801, 1324,  883, "st_3.webp"],
        [1364, 7801,  598,  883, "st_2.webp"],
        [   0, 8724, 1007,  671, "mt_2.webp"],
        [1047, 8724,  917, 1376, "sticker_1.webp"]
      ];
      function pct(n, d) { return (n / d * 100) + "%"; }
      gallery.innerHTML = SHOTS.map(function (s) {
        return '<img class="gd-shot" src="' + BASE + s[4] + '" alt="" loading="lazy" ' +
          'style="left:' + pct(s[0], CW) + ';top:' + pct(s[1], CH) + ';width:' + pct(s[2], CW) + ';height:' + pct(s[3], CH) + '" ' +
          'onerror="this.remove()">';
      }).join("");

      function select(i) {
        cats.forEach(function (b, j) { b.classList.toggle("is-active", j === i); });
        descEl.hidden = cats[i].getAttribute("data-desc") !== "on";  // 전시 전경 = 설명 없음
      }
      cats.forEach(function (b, i) { b.addEventListener("click", function () { select(i); }); });
      select(0);   // 기본: 전시 전경(설명 없음)
    })();
  </script>

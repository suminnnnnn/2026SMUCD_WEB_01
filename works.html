<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 공용(리셋·토큰·헤더·푸터·내비)은 home.css 재사용 + works 전용 레이아웃 -->
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/works.css" />
</head>
<body data-page="works">
  <div class="hp">

    <!-- ================= HEADER (홈과 동일) ================= -->
    <header class="hp-header">
      <a class="hp-brand" href="index.html">
        <span class="hp-brand__logo" aria-hidden="true"></span>
        <span class="hp-brand__text">
          상명대학교<br />커뮤니케이션디자인전공<br />2026 졸업전시
        </span>
      </a>
      <nav class="hp-nav main-nav" id="hp-nav">
        <a data-nav="home" href="index.html">Home</a>
        <a data-nav="works" class="is-active" href="works.html">Works</a>
        <a data-nav="designer" href="designer.html">Designer</a>
        <a data-nav="goods" href="goods.html">Archive</a>      </nav>
      <button class="hp-hamburger hide-d hide-t" id="hp-menu-btn" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <!-- ================= BODY ================= -->
    <!-- 좌: 스튜디오(융합/혁신) → 교수님 · 우: 작품 그리드 -->
    <div class="wk-body">
      <aside class="wk-cats" id="wk-cats">
        <!-- 융합디자인스튜디오 -->
        <div class="wk-studio" data-studio="c">
          <button class="wk-studio__head" type="button">
            <span class="wk-studio__text">
              <span class="wk-studio__ko">융합디자인스튜디오</span>
              <span class="wk-studio__en">Convergence Design studio</span>
            </span>
          </button>
          <div class="wk-profs">
            <div class="wk-profs__row">
              <button class="wk-prof" type="button" data-match="김석진 교수님|이석연 교수님" style="--hand:0deg"><span class="wk-prof__arrow" aria-hidden="true"></span>김석진 • 이석연 교수님</button>
              <button class="wk-prof" type="button" data-match="신윤진 교수님" style="--hand:30deg"><span class="wk-prof__arrow" aria-hidden="true"></span>신윤진 교수님</button>
            </div>
            <div class="wk-profs__row">
              <button class="wk-prof" type="button" data-match="이원제 교수님" style="--hand:60deg"><span class="wk-prof__arrow" aria-hidden="true"></span>이원제 교수님</button>
              <button class="wk-prof" type="button" data-match="서승연 교수님" style="--hand:90deg"><span class="wk-prof__arrow" aria-hidden="true"></span>서승연 교수님</button>
              <button class="wk-prof" type="button" data-match="손우성 교수님" style="--hand:120deg"><span class="wk-prof__arrow" aria-hidden="true"></span>손우성 교수님</button>
            </div>
          </div>
        </div>
        <!-- 혁신디자인스튜디오 -->
        <div class="wk-studio" data-studio="i">
          <button class="wk-studio__head" type="button">
            <span class="wk-studio__text">
              <span class="wk-studio__ko">혁신디자인스튜디오</span>
              <span class="wk-studio__en">Innovation Design studio</span>
            </span>
          </button>
          <div class="wk-profs">
            <div class="wk-profs__row">
              <button class="wk-prof" type="button" data-match="안혜선 교수님" style="--hand:0deg"><span class="wk-prof__arrow" aria-hidden="true"></span>안혜선 교수님</button>
              <button class="wk-prof" type="button" data-match="남정 교수님" style="--hand:30deg"><span class="wk-prof__arrow" aria-hidden="true"></span>남정 교수님</button>
              <button class="wk-prof" type="button" data-match="박소연 교수님" style="--hand:60deg"><span class="wk-prof__arrow" aria-hidden="true"></span>박소연 교수님</button>
            </div>
            <div class="wk-profs__row">
              <button class="wk-prof" type="button" data-match="방경란 교수님" style="--hand:90deg"><span class="wk-prof__arrow" aria-hidden="true"></span>방경란 교수님</button>
              <button class="wk-prof" type="button" data-match="김한솔 교수님" style="--hand:120deg"><span class="wk-prof__arrow" aria-hidden="true"></span>김한솔 교수님</button>
            </div>
          </div>
        </div>
      </aside>

      <div class="wk-main">
        <p class="wk-desc" id="wk-desc" hidden></p>
        <div class="wk-grid" id="wk-grid"></div>
      </div>
    </div>

  </div>

  <!-- ================= FOOTER (홈과 동일) ================= -->
  <footer class="hp-footer">
    <div class="hp-footer__inner">
      <div class="hp-footer__brand">
        <p>2026 상명대학교</p>
        <p>커뮤니케이션디자인전공 졸업전시</p>
        <p>PLAYLIST</p>
      </div>
      <dl class="hp-footer__info">
        <div class="hp-footer__row">
          <dt><span class="hide-m">전시 일정</span><span class="hide-d hide-t">전시 일정</span></dt>
          <dd>2026.10.21 (수) 17:00-19:00<br /><span class="hp-dash">⏤</span> 10.26(월) 11:00-19:00</dd>
        </div>
        <div class="hp-footer__row">
          <dt>전시장 위치</dt>
          <dd>마루아트센터 - 서울 종로구 인사동길 35-6<br />1관, 2관, 3관, 그랜드관, 5관</dd>
        </div>
        <div class="hp-footer__row">
          <dt>인스타그램</dt>
          <dd><a href="https://instagram.com/smucd2026" target="_blank" rel="noopener">@smucd2026</a></dd>
        </div>
      </dl>
    </div>
  </footer>

  <script>
    (function () {
      function h(s) { return (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
      var grid = document.getElementById("wk-grid");
      var catsWrap = document.getElementById("wk-cats");
      var studios = Array.prototype.slice.call(document.querySelectorAll(".wk-studio"));

      function card(w) {
        return (
          '<a class="wk-card" href="work-detail.html?id=' + encodeURIComponent(w.id) + '">' +
          '<span class="wk-card__thumb hp-ph"></span>' +
          '<span class="wk-card__info">' +
          '<span class="wk-card__title">' + h(w.title) + "</span>" +
          '<span class="wk-card__designer">' + h(w.designer) + "</span>" +
          "</span></a>"
        );
      }
      // 융합=`{studentId}-c` · 혁신=`{studentId}-i` · professor 포함
      function buildWorks(designers) {
        var out = [];
        designers.forEach(function (d) {
          var sid = d.studentId || d.id;
          if (d.convergence && d.convergence.title)
            out.push({ id: sid + "-c", title: d.convergence.title, designer: d.name, studio: "c", professor: (d.convergence.professor || "").trim() });
          if (d.innovation && d.innovation.title)
            out.push({ id: sid + "-i", title: d.innovation.title, designer: d.name, studio: "i", professor: (d.innovation.professor || "").trim() });
        });
        return out;
      }

      var descEl = document.getElementById("wk-desc");
      // 스튜디오 선택 시 그리드 위에 표시되는 소개글
      var STUDIO_DESC = {
        c: "「융합디자인스튜디오」는 다양한 학문과 문화적 맥락을 융합적 사고를 기반으로, 복합적 문제를 디자인적으로 해석하고 해결하는 과정을 탐구하는 심화 스튜디오 수업입니다. 학생들은 디자인을 기반으로 인문학적 사고 및 기술, 사회적 이슈가 교차하는 지점에서 ‘문제 해결’을 넘어 새로운 의미로 융합하며 끊임없는 수정과 실험을 통해 디자인의 본질적 가치를 새롭게 탐구하며 학생들은 융합적 사고력, 비판적 통찰력, 협업적 감수성을 함양하며, 사회와의 연결 속에서 디자인의 미래 가능성을 제시하는 교육 과정입니다.",
        i: "「혁신디자인스튜디오」는 창의적 사고와 실험적 탐구를 바탕으로 기존의 디자인 언어를 새로운 가치와 방향성을 연구하는 스튜디오 수업입니다. 학생들은 디자인의 과정에서 끊임없이 ‘지우고, 다시 쓰는’ 반복을 수행하며, 성장하고 불완전함 속에서 새로운 가능성을 발견합니다. 문제의식에서 출발한 프로젝트는 리서치, 콘셉트 도출, 시각화, 구현의 단계를 거쳐, ‘혁신의 형태’를 탐색하는 과정으로 이는 결과물 중심의 학습에서 사유의 깊이를 확장하고 창의적 리더십과 비판적 실천력을 갖춘 미래형 디자이너로의 성장을 지향하는 교육 과정입니다.",
      };

      var ALL = [];
      var state = { studio: null, prof: null };   // studio: 'c'|'i'|null · prof: 버튼 el|null

      function render() {
        var list = ALL;
        if (state.studio) {
          list = ALL.filter(function (w) { return w.studio === state.studio; });
          if (state.prof) {
            var matches = state.prof.getAttribute("data-match").split("|");
            list = list.filter(function (w) { return matches.indexOf(w.professor) >= 0; });
          }
        }
        // 스튜디오 선택 시 소개글 표시(미선택=숨김)
        if (state.studio && STUDIO_DESC[state.studio]) {
          descEl.textContent = STUDIO_DESC[state.studio];
          descEl.hidden = false;
        } else {
          descEl.textContent = "";
          descEl.hidden = true;
        }
        grid.innerHTML = list.length ? list.map(card).join("") : '<p class="wk-empty">작품이 없습니다.</p>';
      }
      function updateUI() {
        studios.forEach(function (st) {
          var key = st.getAttribute("data-studio");
          st.classList.toggle("is-active", state.studio === key);
          Array.prototype.slice.call(st.querySelectorAll(".wk-prof")).forEach(function (p) {
            p.classList.toggle("is-active", p === state.prof);
          });
        });
        catsWrap.classList.toggle("has-active", !!state.studio);
      }

      studios.forEach(function (st) {
        var key = st.getAttribute("data-studio");
        st.querySelector(".wk-studio__head").addEventListener("click", function () {
          if (state.studio === key && !state.prof) { state.studio = null; }   // 다시 누르면 전체
          else { state.studio = key; state.prof = null; }
          updateUI(); render(); window.scrollTo(0, 0);
        });
        Array.prototype.slice.call(st.querySelectorAll(".wk-prof")).forEach(function (p) {
          p.addEventListener("click", function () {
            state.studio = key; state.prof = p;
            updateUI(); render();
          });
        });
      });

      fetch("data/designers_full.json")
        .then(function (r) { return r.json(); })
        .then(function (designers) { ALL = buildWorks(designers); render(); })
        .catch(function () { grid.innerHTML = '<p class="wk-empty">데이터를 불러오지 못했습니다.</p>'; });
    })();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 상명대학교 커뮤니케이션디자인전공 졸업전시 — Works 상세</title>
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/work-detail.css" />
</head>
<body data-page="work-detail">
  <div class="hp">

    <!-- ================= HEADER (홈과 동일) ================= -->
    <header class="hp-header">
      <a class="hp-brand" href="index.html">
        <span class="hp-brand__logo" aria-hidden="true"></span>
        <span class="hp-brand__text">
          상명대학교<br />커뮤니케이션디자인전공<br />2026 졸업전시
        </span>
      </a>
      <nav class="hp-nav main-nav" id="hp-nav">
        <a data-nav="home" href="index.html">Home</a>
        <a data-nav="works" class="is-active" href="works.html">Works</a>
        <a data-nav="designer" href="designer.html">Designer</a>
        <a data-nav="goods" href="goods.html">Archive</a>      </nav>
      <button class="hp-hamburger hide-d hide-t" id="hp-menu-btn" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <!-- ================= BODY ================= -->
    <div class="wd-body">

      <!-- 상단: 좌 이미지 + 우 정보(정보는 이미지 끝까지 sticky) -->
      <div class="wd-top">
      <!-- 작품 이미지 (데스크탑: 좌측 대형 · 태블릿/모바일: 세로 스택) -->
      <div class="wd-gallery">
        <!-- 작품 상세 이미지 (detailImages) · 없으면 placeholder -->
        <div class="wd-shots" id="wd-shots">
          <span class="wd-shot hp-ph"></span>
          <span class="wd-shot hp-ph"></span>
        </div>
        <!-- 유튜브 영상 임베드 (이미지 아래) -->
        <div class="wd-videos" id="wd-videos"></div>
      </div>

      <!-- 정보 -->
      <div class="wd-info">
        <div class="wd-head">
          <a class="wd-back" href="works.html" onclick="if(history.length>1){history.back();return false;}"><img class="wd-back__icon" src="assets/icons/back.svg" alt="" /><span>뒤로가기</span></a>
          <p class="wd-name" id="wd-name"></p>
        </div>
        <div class="wd-about">
          <div class="wd-titlewrap">
            <p class="wd-meta" id="wd-meta"></p>
            <h1 class="wd-title" id="wd-title"></h1>
          </div>
          <div class="wd-descwrap">
            <p class="wd-desc" id="wd-desc"></p>
            <p class="wd-ai" id="wd-ai" hidden></p>
          </div>
          <div class="wd-links" id="wd-links"></div>
        </div>
      </div>
      </div><!-- /.wd-top -->

      <!-- 다른 작품 둘러보기 -->
      <section class="wd-related">
        <h2 class="wd-related__title">다른 작품 둘러보기</h2>
        <div class="wd-related__grid" id="wd-related-grid"></div>
      </section>
    </div>

  </div>

  <!-- ================= FOOTER (홈과 동일) ================= -->
  <footer class="hp-footer">
    <div class="hp-footer__inner">
      <div class="hp-footer__brand">
        <p>2026 상명대학교</p>
        <p>커뮤니케이션디자인전공 졸업전시</p>
        <p>PLAYLIST</p>
      </div>
      <dl class="hp-footer__info">
        <div class="hp-footer__row">
          <dt><span class="hide-m">전시 일정</span><span class="hide-d hide-t">전시 일정</span></dt>
          <dd>2026.10.21 (수)-(일) 10:30-18:30<br /><span class="hp-dash">⏤</span> 10.26 (월) 10:30-17:00</dd>
        </div>
        <div class="hp-footer__row">
          <dt>전시장 위치</dt>
          <dd>마루아트센터 - 서울 종로구 인사동길 35-6<br />1관, 2관, 3관, 4관, 그랜드관, 5관</dd>
        </div>
        <div class="hp-footer__row">
          <dt>인스타그램</dt>
          <dd><a href="https://instagram.com/smucd2026" target="_blank" rel="noopener">@smucd2026</a></dd>
        </div>
      </dl>
    </div>
  </footer>

  <script>
    (function () {
      function h(s) { return (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
      function esc(s) { return (s == null ? "" : String(s)).replace(/"/g, "&quot;"); }
      function qs(id) { return document.getElementById(id); }

      // 전체 작품 목록(융합·혁신) — studentId 로 연결
      function buildWorks(designers) {
        var out = [];
        designers.forEach(function (d) {
          var sid = d.studentId || d.id;
          if (d.convergence && d.convergence.title)
            out.push({ id: sid + "-c", type: "convergence", studio: "융합디자인스튜디오", work: d.convergence, designer: d });
          if (d.innovation && d.innovation.title)
            out.push({ id: sid + "-i", type: "innovation", studio: "혁신디자인스튜디오", work: d.innovation, designer: d });
        });
        return out;
      }

      function thumbImg(src) {
        return src ? '<img src="' + h(src) + '" alt="" loading="lazy" onerror="this.remove()">' : "";
      }
      function relCard(w) {
        return (
          '<a class="wd-rel-card" href="work-detail.html?id=' + encodeURIComponent(w.id) + '">' +
          '<span class="wd-rel-card__thumb hp-ph">' + thumbImg(w.work.thumbnail) + "</span>" +
          '<span class="wd-rel-card__info">' +
          '<span class="wd-rel-card__title">' + h(w.work.title) + "</span>" +
          '<span class="wd-rel-card__designer">' + h(w.designer.name) + "</span>" +
          "</span></a>"
        );
      }

      function render(cur, works) {
        var d = cur.designer, w = cur.work;
        // 디자이너 이름 (한글 + 영문) → 해당 디자이너 상세로 링크
        qs("wd-name").innerHTML =
          '<a class="wd-name__link" href="designer-detail.html?id=' + encodeURIComponent(d.id) + '">' +
          h(d.name) + " <span>" + h(d.nameRoman || "") + "</span></a>";
        // 융합/혁신 스튜디오 | 담당 교수님
        qs("wd-meta").innerHTML =
          h(cur.studio) +
          (w.professor ? ' <span class="wd-meta__bar">|</span> ' + h(w.professor) : "");
        // 작품 제목 · 설명
        qs("wd-title").textContent = w.title || "";
        qs("wd-desc").textContent = w.description || "";

        // 작품 이미지 : detailImages → 없으면 thumbnail → 둘 다 없으면 placeholder 유지
        var imgs = (w.detailImages && w.detailImages.length) ? w.detailImages : (w.thumbnail ? [w.thumbnail] : []);
        if (imgs.length) {
          qs("wd-shots").innerHTML = imgs.map(function (src) {
            return '<img class="wd-shot" src="' + h(src) + '" alt="" loading="lazy" onerror="this.remove()">';
          }).join("");
        }

        // AI 사용 문구 : aiNotice 비어있지 않으면 표시
        var ai = (w.aiNotice || "").trim();
        var aiEl = qs("wd-ai");
        if (ai) { aiEl.textContent = ai; aiEl.hidden = false; }
        else { aiEl.textContent = ""; aiEl.hidden = true; }

        // 유튜브 영상 id 추출 (shorts · youtu.be · watch?v= · embed)
        function ytId(u) {
          var m = u.match(/(?:youtube\.com\/shorts\/|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/);
          if (m) return m[1];
          m = u.match(/[?&]v=([\w-]{6,})/);
          return m ? m[1] : null;
        }
        // 영상 : 유튜브 → 이미지 아래 임베드 · 그 외 → '영상 보기' 링크
        var ytEmbeds = [], otherVideos = [];
        (w.videos || []).forEach(function (u) {
          var id = ytId(u);
          if (id) ytEmbeds.push({ id: id, short: /\/shorts\//.test(u) });
          else otherVideos.push(u);
        });
        qs("wd-videos").innerHTML = ytEmbeds.map(function (v) {
          return '<div class="wd-video' + (v.short ? " wd-video--short" : "") + '">' +
            '<iframe src="https://www.youtube.com/embed/' + v.id + '" loading="lazy" ' +
            'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>';
        }).join("");

        // 링크 : 유튜브 아닌 영상 + 프로토타입 (없으면 아무것도 안 띄움)
        function linkRow(label, urls, cls) {
          if (!urls || !urls.length) return "";
          return urls.map(function (u, idx) {
            var t = urls.length > 1 ? (label + " " + (idx + 1)) : label;
            return '<a class="wd-link' + (cls ? " " + cls : "") + '" href="' + esc(u) + '" target="_blank" rel="noopener">' + t + "</a>";
          }).join("");
        }
        qs("wd-links").innerHTML = linkRow("영상 보기", otherVideos, "") + linkRow("프로토타입 보기", w.prototypes, "wd-link--proto");

        // 다른 작품 둘러보기 : 현재 작품 제외 후 랜덤 셔플 → 4개(데스크탑 4열 · 모바일은 4번째 CSS로 숨겨 3개)
        var pool = works.filter(function (x) { return x.id !== cur.id; });
        for (var si = pool.length - 1; si > 0; si--) { var sj = Math.floor(Math.random() * (si + 1)); var st = pool[si]; pool[si] = pool[sj]; pool[sj] = st; }
        var others = pool.slice(0, 4);
        qs("wd-related-grid").innerHTML = others.map(relCard).join("");
      }

      var id = new URLSearchParams(location.search).get("id");
      fetch("data/designers_full.json")
        .then(function (r) { return r.json(); })
        .then(function (designers) {
          var works = buildWorks(designers);
          var cur = works.filter(function (x) { return x.id === id; })[0] || works[0];
          if (cur) render(cur, works);
        });

    })();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
